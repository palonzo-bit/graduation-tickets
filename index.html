<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Graduation Tickets</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
      color: #222;
    }

    .card {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .ticket-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #eef3f8;
      text-align: left;
      display: none;
    }

    .status {
      margin-top: 18px;
      font-weight: bold;
    }

    .ticket-controls {
      margin-top: 25px;
      text-align: center;
      display: none;
    }

    .ticket-number {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
    }

    #logoutBtn {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🎓 Graduation Tickets</h1>

    <h2>Staff Check-In</h2>

    <div id="loginBox">

      <input
        type="email"
        id="email"
        placeholder="Staff email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <br>

      <button id="loginBtn">
        Sign In
      </button>

    </div>

    <button id="logoutBtn">
      Sign Out
    </button>

    <div class="status" id="status">
      Please sign in.
    </div>


    <div class="ticket-box" id="graduateInfo">

      <h2 id="graduateName"></h2>

      <p>
        <strong>Student ID:</strong>
        <span id="studentId"></span>
      </p>

      <p>
        <strong>Tickets Allowed:</strong>
        <span id="ticketsAllowed"></span>
      </p>

      <p>
        <strong>Tickets Used:</strong>
        <span id="ticketsUsed"></span>
      </p>

      <p>
        <strong>Tickets Remaining:</strong>
      </p>

      <div class="ticket-number" id="ticketsRemaining"></div>

    </div>


    <div class="ticket-controls" id="ticketControls">

      <h3>How many guests are entering now?</h3>

      <button class="useTicketBtn" data-count="1">
        Use 1 Ticket
      </button>

      <button class="useTicketBtn" data-count="2">
        Use 2 Tickets
      </button>

      <button class="useTicketBtn" data-count="3">
        Use 3 Tickets
      </button>

      <button class="useTicketBtn" data-count="4">
        Use 4 Tickets
      </button>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc,
      runTransaction
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAk7ZT1pCcN7wFY0rHRRoCbDvHEHGBoptY",

      authDomain: "graduation-tickets-1897c.firebaseapp.com",

      projectId: "graduation-tickets-1897c",

      storageBucket: "graduation-tickets-1897c.firebasestorage.app",

      messagingSenderId: "570671585141",

      appId: "1:570671585141:web:65c2c0436eead0e184e53c"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const auth = getAuth(app);

    const graduateId = "TEST001";


    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const status =
      document.getElementById("status");


    loginBtn.addEventListener("click", async () => {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      status.textContent =
        "Signing in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ Unable to sign in. Check your email and password.";

      }

    });


    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

    });


    onAuthStateChanged(auth, async (user) => {

      if (user) {

        document.getElementById("loginBox").style.display =
          "none";

        logoutBtn.style.display =
          "inline-block";

        status.textContent =
          "✅ Signed in.";

        await loadGraduate();

      }

      else {

        document.getElementById("loginBox").style.display =
          "block";

        logoutBtn.style.display =
          "none";

        document.getElementById("graduateInfo").style.display =
          "none";

        document.getElementById("ticketControls").style.display =
          "none";

        status.textContent =
          "Please sign in.";

      }

    });


    async function loadGraduate() {

      try {

        const graduateRef =
          doc(db, "graduates", graduateId);

        const graduateSnap =
          await getDoc(graduateRef);


        if (!graduateSnap.exists()) {

          status.textContent =
            "❌ Graduate not found.";

          return;

        }


        const data =
          graduateSnap.data();

        const remaining =
          data.ticketsAllowed - data.ticketsUsed;


        document.getElementById("graduateName").textContent =
          data.name;

        document.getElementById("studentId").textContent =
          data.studentId;

        document.getElementById("ticketsAllowed").textContent =
          data.ticketsAllowed;

        document.getElementById("ticketsUsed").textContent =
          data.ticketsUsed;

        document.getElementById("ticketsRemaining").textContent =
          remaining;


        document.getElementById("graduateInfo").style.display =
          "block";

        document.getElementById("ticketControls").style.display =
          remaining > 0 ? "block" : "none";


        if (remaining === 0) {

          status.textContent =
            "🚫 All guest tickets have been used.";

        }

        else {

          status.textContent =
            "✅ Ready for guest check-in.";

        }

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ Could not load graduate.";

      }

    }


    async function useTickets(count) {

      const graduateRef =
        doc(db, "graduates", graduateId);

      try {

        await runTransaction(db, async (transaction) => {

          const graduateSnap =
            await transaction.get(graduateRef);


          if (!graduateSnap.exists()) {

            throw new Error("Graduate not found.");

          }


          const data =
            graduateSnap.data();

          const remaining =
            data.ticketsAllowed - data.ticketsUsed;


          if (count > remaining) {

            throw new Error(
              `Only ${remaining} ticket(s) remain.`
            );

          }


          const newUsed =
            data.ticketsUsed + count;


          transaction.update(
            graduateRef,
            {
              ticketsUsed: newUsed
            }
          );

        });


        status.textContent =
          `✅ ${count} guest ticket(s) checked in.`;

        await loadGraduate();

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ " + error.message;

      }

    }


    document
      .querySelectorAll(".useTicketBtn")
      .forEach((button) => {

        button.addEventListener("click", () => {

          const count =
            Number(button.dataset.count);

          const confirmUse =
            confirm(
              `Check in ${count} guest ticket(s)?`
            );


          if (confirmUse) {

            useTickets(count);

          }

        });

      });

  </script>

</body>
</html>
