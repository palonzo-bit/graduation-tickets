<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Graduation Guest Check-In</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
      color: #222;
    }

    .card {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    input {
      width: 90%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin: 7px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .lookup {
      margin-top: 25px;
      padding: 20px;
      background: #f7f7f7;
      border-radius: 12px;
      display: none;
    }

    .ticket-box {
      margin-top: 25px;
      padding: 22px;
      border-radius: 12px;
      background: #eef3f8;
      text-align: left;
      display: none;
    }

    .ticket-number {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }

    .remaining-label {
      text-align: center;
      font-weight: bold;
    }

    .ticket-controls {
      margin-top: 25px;
      text-align: center;
      display: none;
    }

    .status {
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    #logoutBtn {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🎓 Graduation Guest Check-In</h1>
    <p>Clark County Acceleration Academies</p>


    <div id="loginBox">

      <h2>Staff Login</h2>

      <input
        type="email"
        id="email"
        placeholder="Staff email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <br>

      <button id="loginBtn">
        Sign In
      </button>

    </div>


    <button id="logoutBtn">
      Sign Out
    </button>


    <div class="lookup" id="lookupBox">

      <h2>🔎 Find Graduate</h2>

      <input
        type="text"
        id="firstName"
        placeholder="First name"
      >

      <input
        type="text"
        id="lastName"
        placeholder="Last name"
      >

      <input
        type="text"
        id="phoneLast4"
        inputmode="numeric"
        maxlength="4"
        placeholder="Last 4 digits of phone"
      >

      <br>

      <button id="searchBtn">
        Find Graduate
      </button>

    </div>


    <div class="status" id="status">
      Please sign in.
    </div>


    <div class="ticket-box" id="graduateInfo">

      <h2 id="graduateName"></h2>

      <p>
        <strong>Campus:</strong>
        <span id="campus"></span>
      </p>

      <p>
        <strong>Phone Last 4:</strong>
        <span id="displayPhone"></span>
      </p>

      <p>
        <strong>Tickets Allowed:</strong>
        <span id="ticketsAllowed"></span>
      </p>

      <p>
        <strong>Tickets Used:</strong>
        <span id="ticketsUsed"></span>
      </p>

      <div class="remaining-label">
        Tickets Remaining
      </div>

      <div
        class="ticket-number"
        id="ticketsRemaining">
      </div>

    </div>


    <div
      class="ticket-controls"
      id="ticketControls">

      <h3>How many guests are entering now?</h3>

      <button class="useTicketBtn" data-count="1">🎟️ 1</button>
      <button class="useTicketBtn" data-count="2">🎟️ 2</button>
      <button class="useTicketBtn" data-count="3">🎟️ 3</button>
      <button class="useTicketBtn" data-count="4">🎟️ 4</button>
      <button class="useTicketBtn" data-count="5">🎟️ 5</button>
      <button class="useTicketBtn" data-count="6">🎟️ 6</button>
      <button class="useTicketBtn" data-count="7">🎟️ 7</button>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      runTransaction,
      doc,
      serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAk7ZT1pCcN7wFY0rHRRoCbDvHEHGBoptY",

      authDomain: "graduation-tickets-1897c.firebaseapp.com",

      projectId: "graduation-tickets-1897c",

      storageBucket: "graduation-tickets-1897c.firebasestorage.app",

      messagingSenderId: "570671585141",

      appId: "1:570671585141:web:65c2c0436eead0e184e53c"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const auth = getAuth(app);


    let currentGraduateId = null;
    let checkInInProgress = false;


    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const searchBtn =
      document.getElementById("searchBtn");

    const status =
      document.getElementById("status");

    const ticketButtons =
      document.querySelectorAll(".useTicketBtn");


    function normalizeName(value) {

      return value
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

    }


    function cleanLast4(value) {

      return value
        .replace(/\D/g, "")
        .slice(0, 4);

    }


    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        status.textContent =
          "Signing in...";

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        }

        catch (error) {

          console.error(error);

          status.textContent =
            "❌ Unable to sign in. Check your email and password.";

        }

      }
    );


    logoutBtn.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );


    onAuthStateChanged(
      auth,
      user => {

        if (user) {

          document
            .getElementById("loginBox")
            .style.display =
            "none";

          logoutBtn.style.display =
            "inline-block";

          document
            .getElementById("lookupBox")
            .style.display =
            "block";

          status.textContent =
            "✅ Signed in. Enter the graduate's information.";

        }

        else {

          currentGraduateId = null;

          document
            .getElementById("loginBox")
            .style.display =
            "block";

          logoutBtn.style.display =
            "none";

          document
            .getElementById("lookupBox")
            .style.display =
            "none";

          document
            .getElementById("graduateInfo")
            .style.display =
            "none";

          document
            .getElementById("ticketControls")
            .style.display =
            "none";

          status.textContent =
            "Please sign in.";

        }

      }
    );


    document
      .getElementById("phoneLast4")
      .addEventListener(
        "input",
        event => {

          event.target.value =
            cleanLast4(
              event.target.value
            );

        }
      );


    searchBtn.addEventListener(
      "click",
      searchGraduate
    );


    async function searchGraduate() {

      const firstName =
        normalizeName(
          document
            .getElementById("firstName")
            .value
        );

      const lastName =
        normalizeName(
          document
            .getElementById("lastName")
            .value
        );

      const phoneLast4 =
        cleanLast4(
          document
            .getElementById("phoneLast4")
            .value
        );


      if (
        !firstName ||
        !lastName
      ) {

        status.textContent =
          "❌ Enter first and last name.";

        return;

      }


      if (
        phoneLast4.length !== 4
      ) {

        status.textContent =
          "❌ Enter the last 4 digits of the phone number.";

        return;

      }


      status.textContent =
        "Searching...";


      try {

        const snapshot =
          await getDocs(
            query(
              collection(
                db,
                "graduates"
              )
            )
          );


        const matches =
          snapshot.docs.filter(
            docSnap => {

              const data =
                docSnap.data();

              return (
                normalizeName(
                  data.firstName || ""
                ) === firstName
                &&
                normalizeName(
                  data.lastName || ""
                ) === lastName
                &&
                String(
                  data.phoneLast4 || ""
                ) === phoneLast4
              );

            }
          );


        if (
          matches.length === 0
        ) {

          currentGraduateId =
            null;

          document
            .getElementById("graduateInfo")
            .style.display =
            "none";

          document
            .getElementById("ticketControls")
            .style.display =
            "none";

          status.textContent =
            "❌ Graduate not found. Check the name and last 4 digits of the phone number.";

          return;

        }


        if (
          matches.length > 1
        ) {

          currentGraduateId =
            null;

          status.textContent =
            "❌ More than one graduate matched. Please use the Manage Graduates page for assistance.";

          return;

        }


        currentGraduateId =
          matches[0].id;


        await loadGraduate();

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ Could not search for graduate.";

      }

    }


    async function loadGraduate() {

      if (!currentGraduateId) {
        return;
      }


      const snapshot =
        await getDocs(
          collection(
            db,
            "graduates"
          )
        );


      const graduateSnap =
        snapshot.docs.find(
          item =>
            item.id === currentGraduateId
        );


      if (!graduateSnap) {

        status.textContent =
          "❌ Graduate not found.";

        return;

      }


      const data =
        graduateSnap.data();


      const allowed =
        Number(
          data.ticketsAllowed || 0
        );

      const used =
        Number(
          data.ticketsUsed || 0
        );

      const remaining =
        allowed - used;


      document
        .getElementById("graduateName")
        .textContent =
        data.name;


      document
        .getElementById("campus")
        .textContent =
        data.campus || "—";


      document
        .getElementById("displayPhone")
        .textContent =
        data.phoneLast4 || "—";


      document
        .getElementById("ticketsAllowed")
        .textContent =
        allowed;


      document
        .getElementById("ticketsUsed")
        .textContent =
        used;


      document
        .getElementById("ticketsRemaining")
        .textContent =
        remaining;


      document
        .getElementById("graduateInfo")
        .style.display =
        "block";


      if (
        data.active === false
      ) {

        document
          .getElementById("ticketControls")
          .style.display =
          "none";

        status.textContent =
          "🚫 This graduate's tickets are inactive.";

      }

      else if (
        remaining <= 0
      ) {

        document
          .getElementById("ticketControls")
          .style.display =
          "none";

        status.textContent =
          "🚫 All guest tickets have already been used.";

      }

      else {

        document
          .getElementById("ticketControls")
          .style.display =
          "block";

        status.textContent =
          "✅ Graduate found. Ready for guest check-in.";

      }

    }


    function setTicketButtonsDisabled(
      disabled
    ) {

      ticketButtons.forEach(
        button => {

          button.disabled =
            disabled;

        }
      );

    }


    async function useTickets(
      count
    ) {

      if (
        !currentGraduateId ||
        checkInInProgress
      ) {

        return;

      }


      checkInInProgress =
        true;

      setTicketButtonsDisabled(
        true
      );


      try {

        status.textContent =
          "Processing check-in...";


        const graduateRef =
          doc(
            db,
            "graduates",
            currentGraduateId
          );


        await runTransaction(
          db,
          async transaction => {

            const graduateSnap =
              await transaction.get(
                graduateRef
              );


            if (
              !graduateSnap.exists()
            ) {

              throw new Error(
                "Graduate not found."
              );

            }


            const data =
              graduateSnap.data();


            if (
              data.active === false
            ) {

              throw new Error(
                "These tickets are inactive."
              );

            }


            const allowed =
              Number(
                data.ticketsAllowed || 0
              );


            const used =
              Number(
                data.ticketsUsed || 0
              );


            const remaining =
              allowed - used;


            if (
              count > remaining
            ) {

              throw new Error(
                `Only ${remaining} ticket(s) remain.`
              );

            }


            if (
              !data.publicTicketCode
            ) {

              throw new Error(
                "Public ticket code is missing."
              );

            }


            const publicTicketRef =
              doc(
                db,
                "publicTickets",
                data.publicTicketCode
              );


            const publicTicketSnap =
              await transaction.get(
                publicTicketRef
              );


            if (
              !publicTicketSnap.exists()
            ) {

              throw new Error(
                "Public ticket record not found."
              );

            }


            const newUsed =
              used + count;


            transaction.update(
              graduateRef,
              {
                ticketsUsed:
                  newUsed
              }
            );


            transaction.update(
              publicTicketRef,
              {
                ticketsUsed:
                  newUsed
              }
            );


            const checkInRef =
              doc(
                collection(
                  db,
                  "checkIns"
                )
              );


            transaction.set(
              checkInRef,
              {
                graduateId:
                  currentGraduateId,

                graduateName:
                  data.name,

                studentId:
                  data.studentID || "",

                guestCount:
                  count,

                eventType:
                  "guest-check-in",

                staffEmail:
                  auth.currentUser.email,

                timestamp:
                  serverTimestamp()
              }
            );

          }
        );


        await loadGraduate();


        status.textContent =
          `✅ ${count} guest(s) checked in successfully.`;

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ " +
          error.message;

      }

      finally {

        checkInInProgress =
          false;

        setTicketButtonsDisabled(
          false
        );

      }

    }


    ticketButtons.forEach(
      button => {

        button.addEventListener(
          "click",

          async () => {

            if (
              checkInInProgress
            ) {

              return;

            }


            const count =
              Number(
                button.dataset.count
              );


            const confirmUse =
              confirm(
                `Check in ${count} guest(s) for this graduate?`
              );


            if (
              confirmUse
            ) {

              await useTickets(
                count
              );

            }

          }
        );

      }
    );

  </script>

</body>
</html>
