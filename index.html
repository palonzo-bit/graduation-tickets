<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Graduation Guest Check-In</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
      color: #222;
    }

    .card {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    input {
      width: 90%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin: 7px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .lookup {
      margin-top: 25px;
      padding: 20px;
      background: #f7f7f7;
      border-radius: 12px;
      display: none;
    }

    .ticket-box {
      margin-top: 25px;
      padding: 22px;
      border-radius: 12px;
      background: #eef3f8;
      text-align: left;
      display: none;
    }

    .ticket-number {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }

    .remaining-label {
      text-align: center;
      font-weight: bold;
    }

    .ticket-controls {
      margin-top: 25px;
      text-align: center;
      display: none;
    }

    .status {
      margin-top: 18px;
      font-weight: bold;
    }

    #logoutBtn {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🎓 Graduation Guest Check-In</h1>
    <p>Clark County Acceleration Academies</p>


    <div id="loginBox">

      <h2>Staff Login</h2>

      <input
        type="email"
        id="email"
        placeholder="Staff email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <br>

      <button id="loginBtn">
        Sign In
      </button>

    </div>


    <button id="logoutBtn">
      Sign Out
    </button>


    <div class="lookup" id="lookupBox">

      <h2>🔎 Find Graduate</h2>

      <input
        type="text"
        id="graduateSearch"
        placeholder="Enter Student ID"
        autocomplete="off"
      >

      <br>

      <button id="searchBtn">
        Find Graduate
      </button>

    </div>


    <div class="status" id="status">
      Please sign in.
    </div>


    <div class="ticket-box" id="graduateInfo">

      <h2 id="graduateName"></h2>

      <p>
        <strong>Student ID:</strong>
        <span id="studentId"></span>
      </p>

      <p>
        <strong>Tickets Allowed:</strong>
        <span id="ticketsAllowed"></span>
      </p>

      <p>
        <strong>Tickets Used:</strong>
        <span id="ticketsUsed"></span>
      </p>

      <div class="remaining-label">
        Tickets Remaining
      </div>

      <div
        class="ticket-number"
        id="ticketsRemaining">
      </div>

    </div>


    <div
      class="ticket-controls"
      id="ticketControls">

      <h3>How many guests are entering now?</h3>

      <button class="useTicketBtn" data-count="1">
        🎟️ 1
      </button>

      <button class="useTicketBtn" data-count="2">
        🎟️ 2
      </button>

      <button class="useTicketBtn" data-count="3">
        🎟️ 3
      </button>

      <button class="useTicketBtn" data-count="4">
        🎟️ 4
      </button>

      <button class="useTicketBtn" data-count="5">
        🎟️ 5
      </button>

      <button class="useTicketBtn" data-count="6">
        🎟️ 6
      </button>

      <button class="useTicketBtn" data-count="7">
        🎟️ 7
      </button>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
  getFirestore,
  doc,
  getDoc,
  runTransaction,
  collection,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAk7ZT1pCcN7wFY0rHRRoCbDvHEHGBoptY",

      authDomain: "graduation-tickets-1897c.firebaseapp.com",

      projectId: "graduation-tickets-1897c",

      storageBucket: "graduation-tickets-1897c.firebasestorage.app",

      messagingSenderId: "570671585141",

      appId: "1:570671585141:web:65c2c0436eead0e184e53c"

    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentGraduateId = null;


    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const searchBtn =
      document.getElementById("searchBtn");

    const searchInput =
      document.getElementById("graduateSearch");

    const status =
      document.getElementById("status");


    loginBtn.addEventListener("click", async () => {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      status.textContent = "Signing in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ Unable to sign in. Check your email and password.";

      }

    });


    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

    });


    onAuthStateChanged(auth, (user) => {

      if (user) {

        document.getElementById("loginBox").style.display =
          "none";

        logoutBtn.style.display =
          "inline-block";

        document.getElementById("lookupBox").style.display =
          "block";

        status.textContent =
          "✅ Signed in. Enter a Student ID.";

      }

      else {

        currentGraduateId = null;

        document.getElementById("loginBox").style.display =
          "block";

        logoutBtn.style.display =
          "none";

        document.getElementById("lookupBox").style.display =
          "none";

        document.getElementById("graduateInfo").style.display =
          "none";

        document.getElementById("ticketControls").style.display =
          "none";

        status.textContent =
          "Please sign in.";

      }

    });


    searchBtn.addEventListener("click", searchGraduate);


    searchInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        searchGraduate();
      }

    });


    async function searchGraduate() {

      const enteredId =
        searchInput.value.trim().toUpperCase();

      if (!enteredId) {

        status.textContent =
          "❌ Enter a Student ID.";

        return;

      }

      currentGraduateId = enteredId;

      status.textContent =
        "Searching...";

      await loadGraduate();

    }


    async function loadGraduate() {

      if (!currentGraduateId) {
        return;
      }

      try {

        const graduateRef =
          doc(
            db,
            "graduates",
            currentGraduateId
          );

        const graduateSnap =
          await getDoc(graduateRef);


        if (!graduateSnap.exists()) {

          document.getElementById("graduateInfo").style.display =
            "none";

          document.getElementById("ticketControls").style.display =
            "none";

          status.textContent =
            "❌ Graduate not found. Check the Student ID.";

          return;

        }


        const data =
          graduateSnap.data();

        const remaining =
          data.ticketsAllowed - data.ticketsUsed;


        document.getElementById("graduateName").textContent =
          data.name;

        document.getElementById("studentId").textContent =
          data.studentId;

        document.getElementById("ticketsAllowed").textContent =
          data.ticketsAllowed;

        document.getElementById("ticketsUsed").textContent =
          data.ticketsUsed;

        document.getElementById("ticketsRemaining").textContent =
          remaining;


        document.getElementById("graduateInfo").style.display =
          "block";


        document.getElementById("ticketControls").style.display =
          remaining > 0 ? "block" : "none";


        if (data.active === false) {

          document.getElementById("ticketControls").style.display =
            "none";

          status.textContent =
            "🚫 This graduate's tickets are inactive.";

        }

        else if (remaining === 0) {

          status.textContent =
            "🚫 All guest tickets have already been used.";

        }

        else {

          status.textContent =
            "✅ Graduate found. Ready for guest check-in.";

        }

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ Could not load graduate.";

      }

    }


    async function useTickets(count) {

      if (!currentGraduateId) {
        return;
      }


      const graduateRef =
        doc(
          db,
          "graduates",
          currentGraduateId
        );


      try {

        await runTransaction(
          db,
          async (transaction) => {

            const graduateSnap =
              await transaction.get(graduateRef);


            if (!graduateSnap.exists()) {

              throw new Error(
                "Graduate not found."
              );

            }


            const data =
              graduateSnap.data();


            if (data.active === false) {

              throw new Error(
                "These tickets are inactive."
              );

            }


            const remaining =
              data.ticketsAllowed -
              data.ticketsUsed;


            if (count > remaining) {

              throw new Error(
                `Only ${remaining} ticket(s) remain.`
              );

            }


        transaction.update(
  graduateRef,
  {
    ticketsUsed:
      data.ticketsUsed + count
  }
);

const checkInRef =
  doc(collection(db, "checkIns"));

transaction.set(
  checkInRef,
  {
    graduateId: currentGraduateId,
    graduateName: data.name,
    studentId: data.studentId,
    guestCount: count,
    staffEmail: auth.currentUser.email,
    timestamp: serverTimestamp()
  }
);   

        await loadGraduate();

        status.textContent =
          `✅ ${count} guest(s) checked in successfully.`;

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ " + error.message;

      }

    }


    document
      .querySelectorAll(".useTicketBtn")
      .forEach((button) => {

        button.addEventListener(
          "click",
          () => {

            const count =
              Number(button.dataset.count);

            const confirmUse =
              confirm(
                `Check in ${count} guest(s) for this graduate?`
              );

            if (confirmUse) {
              useTickets(count);
            }

          }
        );

      });

  </script>

</body>
</html>
