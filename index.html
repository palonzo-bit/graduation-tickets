<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Graduation Tickets</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
      color: #222;
    }

    .card {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .ticket-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #eef3f8;
      text-align: left;
    }

    .success {
      font-weight: bold;
      margin-top: 20px;
    }

    .error {
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🎓 Graduation Tickets</h1>

    <h2>Clark County Acceleration Academies</h2>

    <p>Testing our live graduate database connection.</p>

    <div id="status">
      Looking up TEST001...
    </div>

    <div class="ticket-box" id="graduateInfo" style="display:none;">

      <h2 id="graduateName"></h2>

      <p>
        <strong>Student ID:</strong>
        <span id="studentId"></span>
      </p>

      <p>
        <strong>Tickets Allowed:</strong>
        <span id="ticketsAllowed"></span>
      </p>

      <p>
        <strong>Tickets Used:</strong>
        <span id="ticketsUsed"></span>
      </p>

      <p>
        <strong>Tickets Remaining:</strong>
        <span id="ticketsRemaining"></span>
      </p>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAk7ZT1pCcN7wFY0rHRRoCbDvHEHGBoptY",

      authDomain: "graduation-tickets-1897c.firebaseapp.com",

      projectId: "graduation-tickets-1897c",

      storageBucket: "graduation-tickets-1897c.firebasestorage.app",

      messagingSenderId: "570671585141",

      appId: "1:570671585141:web:65c2c0436eead0e184e53c"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    async function loadTestGraduate() {

      const status = document.getElementById("status");

      try {

        const graduateRef =
          doc(db, "graduates", "TEST001");

        const graduateSnap =
          await getDoc(graduateRef);


        if (graduateSnap.exists()) {

          const data = graduateSnap.data();

          const remaining =
            data.ticketsAllowed - data.ticketsUsed;


          document.getElementById("graduateName").textContent =
            data.name;

          document.getElementById("studentId").textContent =
            data.studentId;

          document.getElementById("ticketsAllowed").textContent =
            data.ticketsAllowed;

          document.getElementById("ticketsUsed").textContent =
            data.ticketsUsed;

          document.getElementById("ticketsRemaining").textContent =
            remaining;


          document.getElementById("graduateInfo").style.display =
            "block";

          status.innerHTML =
            "✅ TEST001 found in Firebase!";

          status.className =
            "success";

        }

        else {

          status.innerHTML =
            "❌ TEST001 was not found.";

          status.className =
            "error";

        }

      }

      catch (error) {

        console.error(error);

        status.innerHTML =
          "❌ Firebase could not read the graduate record.";

        status.className =
          "error";

      }

    }


    loadTestGraduate();

  </script>

</body>
</html>
